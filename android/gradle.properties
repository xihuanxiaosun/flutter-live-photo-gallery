# 插件 android 模块独立构建 / 单元测试（CI）所需。
# 嵌入 Flutter 工程编译时由宿主 App 的 gradle.properties 提供这些值，此文件仅用于
# 单独对本模块跑 `./gradlew test` / `assemble` 的场景（否则 AGP 会因检测到 AndroidX
# 依赖但未启用 useAndroidX 而编译失败）。
android.useAndroidX=true
android.enableJetifier=false
# compileSdk 34 在部分 AGP 版本上仅为「未正式支持」的警告，抑制之避免噪声
android.suppressUnsupportedCompileSdk=34
